<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Cycle Game</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Prompt', sans-serif;
    overflow: hidden;

    /* ท้องฟ้า */
    background: linear-gradient(to top, #4FC3F7, #81D4FA, #E1F5FE, #ffffff);
}

/* ☀️ ดวงอาทิตย์ */
.sun {
    position: absolute;
    top: 40px;
    right: 50px;
    width: 80px;
    height: 80px;
    background: radial-gradient(circle, #FFD54F, #FFA000);
    border-radius: 50%;
    box-shadow: 0 0 50px #FFD54F;
}

/* ☁️ เมฆ */
.cloud {
    position: absolute;
    background: white;
    border-radius: 50px;
    width: 120px;
    height: 60px;
    opacity: 0.9;
    animation: moveCloud 40s linear infinite;
}

.cloud:before, .cloud:after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud:before {
    width: 60px; height: 60px;
    top: -30px; left: 10px;
}

.cloud:after {
    width: 80px; height: 80px;
    top: -40px; right: 10px;
}

@keyframes moveCloud {
    from { transform: translateX(-200px); }
    to { transform: translateX(120vw); }
}

/* 🌧️ ฝน */
.rain {
    position: absolute;
    width: 2px;
    height: 15px;
    background: rgba(255,255,255,0.6);
    animation: rainFall linear infinite;
}

@keyframes rainFall {
    to {
        transform: translateY(100vh);
    }
}

/* 🌊 น้ำ */
.water {
    position: absolute;
    bottom: 0;
    width: 200%;
    height: 150px;
    background: rgba(0,150,255,0.5);
    border-radius: 40%;
    animation: wave 6s infinite linear;
}

@keyframes wave {
    0% { transform: translateX(0); }
    50% { transform: translateX(-25%); }
    100% { transform: translateX(0); }
}

/* 🎯 กล่อง */
.card {
    width: 90%;
    max-width: 500px;
    background: rgba(255,255,255,0.85);
    padding: 40px;
    border-radius: 25px;
    text-align: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

/* ข้อความ */
h1 { color:#0288D1; }
p { color:#555; margin:15px 0; }

/* input */
input {
    width:100%;
    padding:15px;
    border-radius:15px;
    border:2px solid #81D4FA;
    margin-bottom:20px;
}

/* ปุ่ม */
button {
    width:100%;
    padding:15px;
    border:none;
    border-radius:20px;
    background: linear-gradient(to right, #0288D1, #4FC3F7);
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<!-- ☀️ -->
<div class="sun"></div>

<!-- ☁️ -->
<div class="cloud" style="top:10%; animation-duration:50s;"></div>
<div class="cloud" style="top:30%; animation-duration:60s;"></div>
<div class="cloud" style="top:50%; animation-duration:45s;"></div>

<!-- 🌊 -->
<div class="water"></div>

<!-- 🎯 UI -->
<div class="card">
    <h1>🌍 เกมวัฏจักรน้ำ</h1>
    <p>ใส่ชื่อก่อนเริ่มการผจญภัยของน้ำ 💧</p>

    <input type="text" id="name" placeholder="ใส่ชื่อของคุณ...">

    <button onclick="startGame()">เริ่มเกม 🚀</button>
</div>

<script>
// 🌧️ สร้างฝน
for(let i=0;i<100;i++){
    let rain = document.createElement("div");
    rain.classList.add("rain");
    rain.style.left = Math.random()*100+"vw";
    rain.style.animationDuration = (Math.random()*1+0.5)+"s";
    rain.style.opacity = Math.random();
    document.body.appendChild(rain);
}

function startGame(){
    let name = document.getElementById("name").value;
    if(name===""){
        alert("ใส่ชื่อก่อนนะ!");
        return;
    }
    alert("ยินดีต้อนรับ "+name+" 🌊");
    window.location.href = "game.html";
}
</script>

</body>
</html>
